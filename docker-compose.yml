version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailtrace-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailtrace_db}
      POSTGRES_USER: ${POSTGRES_USER:-mailtrace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailtrace_user} -d ${POSTGRES_DB:-mailtrace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
